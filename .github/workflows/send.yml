name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      # 配置来源优先级：仓库文件（由配置助手推送）> DOUYIN_CONFIG Secret。
      # 这样老用户的 Secret 继续有效，用配置助手推一次后自动切换。
      #
      # 实现说明：这里刻意不用 heredoc 内嵌 Python。YAML 块标量 + shell heredoc
      # 的缩进规则相互干扰（内容顶格才能让 Python 正确解析，但顶格又会打断
      # YAML 的视觉层级），很容易写错且出错后极难排查。改用 python -c 单行 +
      # 分号，配合 shell 自身的校验，逻辑清楚且无缩进陷阱。
      - name: Write protected configuration
        shell: bash
        env:
          REPO_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          if [ -f config.json ]; then
            echo "使用仓库里的 config.json（由配置助手推送）"
          elif [ -n "$REPO_CONFIG" ]; then
            echo "仓库里没有配置文件，回退到 DOUYIN_CONFIG Secret"
            printf '%s' "$REPO_CONFIG" > config.json
          else
            echo "错误：既没有仓库配置文件，也没有 DOUYIN_CONFIG Secret"
            exit 1
          fi
          if [ ! -s config.json ]; then
            echo "错误：config.json 是空的"
            exit 1
          fi
          python -c "import json,sys; json.load(open('config.json',encoding='utf-8')); print('config.json 校验通过')"

      # Cookie 来源优先级：仓库文件（由配置助手推送）> DOUYIN_COOKIE Secret。
      # 只在仓库里存在 cookie.active.json 时才覆盖，否则完全保持原行为。
      - name: Load cookie from repository file
        shell: bash
        run: |
          if [ -f cookie.active.json ]; then
            echo "使用仓库里的 cookie.active.json（由配置助手推送）"
            python -c "import json,pathlib; d=json.loads(pathlib.Path('cookie.active.json').read_text(encoding='utf-8')); p=pathlib.Path('.env'); lines=p.read_text(encoding='utf-8').splitlines() if p.is_file() else []; lines=[l for l in lines if not l.startswith('DOUYIN_COOKIE=')]; lines.append('DOUYIN_COOKIE='+json.dumps(json.dumps(d,ensure_ascii=False))); p.write_text(chr(10).join(lines)+chr(10),encoding='utf-8'); print('已写入 %d 条 Cookie 到 .env' % len(d))"
          else
            echo "仓库里没有 cookie 文件，继续使用 DOUYIN_COOKIE Secret"
          fi

      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              # 没有配置任何多账号 Secret（DOUYIN_COOKIE_ACCOUNTn）：
              # 保持旧单账号模式，不生成 accounts.json。
              print("未配置多账号 Secret，继续使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  # 没有配置 DOUYIN_COOKIE_ACCOUNT1 时，旧版 DOUYIN_COOKIE /
                  # DOUYIN_CONFIG 自动作为账号1，方便老用户直接追加新账号。
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时配置"
                  )
              # 提前校验，出错时直接指出是哪个 Secret，避免任务执行时才报错
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              # Cookie 用 JSON 字符串转义后写入，dotenv 可精确还原，
              # 兼容多行 Cookie JSON 与 # 等特殊字符
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
